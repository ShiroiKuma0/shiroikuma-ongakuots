## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Fri Nov 08 00:03:25 ICT 2024
android.enableJetifier=false
android.nonFinalResIds=false
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.jvm.target.validation.mode=IGNORE
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx5120m -XX:+UseParallelGC
org.gradle.unsafe.configuration-cache=true
ksp.useKSP2=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.usesSdkInManifest.disallowed=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# shiroikuma fork: FOSS build — no Sentry, no Firebase Crashlytics, no Google Cast SDK, and the
# Last.fm stub (a fork ships no Last.fm credentials anyway, so the real module could not work).
isFullBuild=false

# --- shiroikuma fork build tail --------------------------------------------------------------
# BUILD_NUMBER is our per-build counter, bumped by `./gradlew buildFork`. It NEVER resets: `master`
# mirrors the bleeding upstream/dev, whose versionCode stands still between upstream releases, so a
# reset would send our versionCode backwards and the installer would read the next build as a
# downgrade. LAST_BUILT_VERSION_CODE records the highest code ever shipped; buildFork fails rather
# than build at or below it. See .claude/skills/build-apk.
BUILD_NUMBER=14
LAST_BUILT_VERSION_CODE=570013
